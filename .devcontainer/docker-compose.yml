# IMPORTANT:
# - Ensure your local Postgres instance allows connections from Docker (listen_addresses and pg_hba.conf).
# - Make sure to create the file .env_dev_local in the root of your project with the necessary environment variables.

#version: '3.8'  # Outdated key. Uncomment only if needed.

services:
  app:
    container_name: "${COMPOSE_PROJECT_NAME}_app"
    image: python:3.14
    env_file:
      - ../.env_dev_local
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}

    volumes:
      - ../..:/workspaces:cached

    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity


